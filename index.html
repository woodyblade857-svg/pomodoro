<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>BMS — Mouse Locomotor Scoring</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,400;0,500;1,400&family=Space+Grotesk:wght@400;500;600;700&display=swap');

  :root {
    --bg: #f8f7f4;
    --surface: #ffffff;
    --border: #e6e3dd;
    --text: #2c2c2c;
    --text-muted: #8c8a84;
    --accent: #1a1a1a;
    --shadow: 0 1px 3px rgba(0,0,0,0.04),0 1px 2px rgba(0,0,0,0.06);
    --shadow-lg: 0 4px 16px rgba(0,0,0,0.06),0 1px 4px rgba(0,0,0,0.04);
    --radius: 10px;
    --radius-sm: 6px;
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Space Grotesk', system-ui, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh;
  }
  body::before {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none; opacity:0.025;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }

  .app { position:relative; z-index:1; max-width:1440px; margin:0 auto; padding:24px 32px; }

  .header {
    display:flex; align-items:center; justify-content:space-between;
    padding:20px 0 32px; border-bottom:1px solid var(--border); margin-bottom:24px;
  }
  .header-left h1 { font-size:26px; font-weight:700; letter-spacing:-0.5px; color:var(--accent); }
  .header-left .subtitle {
    font-family:'DM Mono', monospace; font-size:12px; color:var(--text-muted);
    letter-spacing:1px; text-transform:uppercase; margin-top:2px;
  }
  .header-right { display:flex; gap:10px; flex-wrap:wrap; }

  .btn {
    font-family:'Space Grotesk', sans-serif; font-size:13px; font-weight:600;
    padding:9px 18px; border-radius:var(--radius-sm); border:1.5px solid transparent;
    cursor:pointer; transition:all 0.18s ease; letter-spacing:0.2px;
    display:inline-flex; align-items:center; gap:6px;
  }
  .btn-primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary:hover { background:#333; }
  .btn-outline { background:transparent; color:var(--accent); border-color:var(--border); }
  .btn-outline:hover { background:#f3f2ef; border-color:#ccc; }
  .btn-danger { background:transparent; color:#c44e52; border-color:#e8d0d0; font-size:11px; padding:4px 10px; }
  .btn-danger:hover { background:#fdf2f2; border-color:#c44e52; }
  .btn-add {
    background:transparent; color:var(--accent); border:1.5px dashed var(--border);
    font-size:13px; padding:8px 16px;
  }
  .btn-add:hover { border-color:var(--accent); background:#fafaf8; }

  /* ---------- panel ---------- */
  .panel {
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:18px 22px; margin-bottom:16px;
  }
  .panel-row { display:flex; gap:16px; flex-wrap:wrap; align-items:end; }
  .fg { display:flex; flex-direction:column; gap:4px; }
  .fg label { font-size:10px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:0.8px; white-space:nowrap; }
  .fg input[type=text], .fg input[type=number] {
    font-family:'DM Mono', monospace; font-size:14px; padding:7px 10px;
    border:1.5px solid var(--border); border-radius:var(--radius-sm);
    background:var(--bg); outline:none; transition:border 0.15s;
  }
  .fg input:focus { border-color:var(--accent); }
  .fg select {
    font-family:'Space Grotesk', sans-serif; font-size:13px; padding:7px 10px;
    border:1.5px solid var(--border); border-radius:var(--radius-sm);
    background:var(--bg); outline:none;
  }
  .fg input[type=range] { accent-color: var(--accent); margin-top:2px; }
  .fg input[type=color] {
    width:36px; height:30px; border:1.5px solid var(--border); border-radius:var(--radius-sm);
    padding:1px; cursor:pointer; background:var(--bg);
  }

  /* ---------- group editor ---------- */
  .group-editor-row {
    display:flex; align-items:end; gap:10px; flex-wrap:wrap;
    padding:10px 14px; border:1px solid var(--border); border-radius:var(--radius-sm);
    background:#fdfdfc; margin-bottom:8px;
  }
  .group-editor-row .fg input[type=text] { width:150px; }
  .group-editor-row .fg input[type=number] { width:70px; }

  .noise-display {
    font-family:'DM Mono', monospace; font-size:14px; font-weight:600;
    min-width:32px; text-align:center;
  }

  /* ---------- timepoint chips ---------- */
  .chip-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chip-bar-label { font-size:10px; font-weight:600; color:var(--text-muted); text-transform:uppercase; letter-spacing:1px; white-space:nowrap; }
  .tp-chip {
    font-family:'DM Mono', monospace; font-size:11px; font-weight:600;
    padding:5px 12px; border-radius:16px; border:1.5px solid var(--border);
    background:var(--bg); cursor:pointer; transition:all 0.15s;
    user-select:none; display:flex; align-items:center; gap:5px;
  }
  .tp-chip:hover { border-color:#bbb; }
  .tp-chip.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  .tp-chip.off { color:#ccc; text-decoration:line-through; text-decoration-color:#ddd; }
  .chip-preset {
    font-family:'Space Grotesk', sans-serif; font-size:10px; font-weight:600;
    padding:4px 10px; border-radius:12px; border:1px solid var(--border);
    background:#fff; cursor:pointer; color:var(--text-muted); transition:all 0.15s;
  }
  .chip-preset:hover { border-color:var(--accent); color:var(--accent); }

  /* ---------- group grid ---------- */
  .group-grid {
    display:grid; grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));
    gap:18px; margin-bottom:28px;
  }
  .group-card {
    background:var(--surface); border-radius:var(--radius); box-shadow:var(--shadow);
    overflow:hidden; transition:box-shadow 0.2s;
  }
  .group-card:hover { box-shadow:var(--shadow-lg); }
  .group-card-header {
    padding:14px 18px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--border);
  }
  .group-name { font-weight:700; font-size:14px; display:flex; align-items:center; gap:8px; }
  .group-dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
  .group-n { font-family:'DM Mono', monospace; font-size:11px; color:var(--text-muted); }
  .group-card-body { padding:10px 14px 14px; max-height:260px; overflow:auto; }
  .mini-table { width:100%; border-collapse:collapse; font-size:12px; }
  .mini-table th {
    font-family:'DM Mono', monospace; font-size:10px; font-weight:500;
    color:var(--text-muted); padding:5px 3px; text-align:center;
    position:sticky; top:0; background:var(--surface); z-index:1;
    border-bottom:2px solid var(--border);
  }
  .mini-table td { padding:2px 2px; text-align:center; }
  .mini-table input {
    font-family:'DM Mono', monospace; font-size:12px; width:36px; text-align:center;
    border:1px solid transparent; border-radius:3px; padding:3px 1px;
    background:transparent; outline:none; transition:all 0.12s;
  }
  .mini-table input:hover { border-color:#ddd; }
  .mini-table input:focus { border-color:var(--accent); background:#fafaf8; }
  .mouse-label { font-family:'DM Mono', monospace; font-size:11px; color:var(--text-muted); }
  .group-avg {
    font-family:'DM Mono', monospace; font-size:11px; padding:8px 18px;
    border-top:1px solid var(--border); color:var(--text-muted);
    display:flex; justify-content:space-between;
  }
  .group-avg strong { color:var(--text); }

  /* ---------- chart ---------- */
  .chart-wrap { position:relative; height:420px; }
  canvas { width:100%; height:100%; }
  .chart-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .chart-header h2 { font-size:16px; font-weight:700; }
  .legend-inline { display:flex; gap:18px; flex-wrap:wrap; }
  .legend-item { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:500; }
  .legend-line { width:22px; height:3px; border-radius:2px; }

  .footer {
    display:flex; justify-content:center; padding:8px;
    font-size:11px; color:var(--text-muted);
    font-family:'DM Mono', monospace;
  }

  .toast {
    position:fixed; bottom:28px; left:50%; transform:translateX(-50%);
    background:var(--accent); color:#fff; padding:10px 24px;
    border-radius:20px; font-size:13px; font-weight:600; z-index:999;
    opacity:0; transition:opacity 0.3s; pointer-events:none;
  }
  .toast.show { opacity:1; }

  .sep { width:1px; background:var(--border); align-self:stretch; margin:0 4px; }

  @media (max-width:768px) {
    .app { padding:16px; }
    .header { flex-direction:column; gap:14px; align-items:flex-start; }
    .group-grid { grid-template-columns:1fr; }
    .panel-row { gap:10px; }
  }
</style>
</head>
<body>

<div class="app">
  <!-- ====== HEADER ====== -->
  <div class="header">
    <div class="header-left">
      <h1>BMS Scoring</h1>
      <div class="subtitle">Basso Mouse Scale &middot; Spinal Cord Injury</div>
    </div>
    <div class="header-right">
      <button class="btn btn-primary" onclick="generateRandom()">🎲 生成随机数据</button>
      <button class="btn btn-outline" onclick="exportCSV()">⬇ 导出 CSV</button>
    </div>
  </div>

  <!-- ====== PANEL 1: basic config + noise ====== -->
  <div class="panel">
    <div class="panel-row">
      <div class="fg">
        <label>每笼小鼠数</label>
        <input type="number" id="micePerGroup" value="6" min="2" max="20" style="width:80px" onchange="rebuild()">
      </div>
      <div class="fg">
        <label>时间点 (逗号分隔)</label>
        <input type="text" id="timepointsInput" value="1,3,7,14,21,28" style="width:240px;font-family:'DM Mono',monospace;font-size:14px" onchange="onTimepointsChange()" placeholder="1,3,7,14,21,28">
      </div>
      <div class="sep"></div>
      <div class="fg">
        <label>随机噪声: <span id="noiseLabel" class="noise-display" style="font-size:13px">1.0</span></label>
        <input type="range" id="noiseLevel" min="0" max="3" step="0.1" value="1.0" style="width:160px"
          oninput="document.getElementById('noiseLabel').textContent=this.value">
      </div>
      <div style="display:flex;gap:4px;margin-left:auto">
        <button class="chip-preset" onclick="setPreset('sci')">SCI 标准</button>
        <button class="chip-preset" onclick="setPreset('acute')">急性期</button>
        <button class="chip-preset" onclick="setPreset('chronic')">慢性期</button>
        <button class="chip-preset" onclick="setPreset('daily')">每日</button>
      </div>
    </div>
  </div>

  <!-- ====== PANEL 2: group editor ====== -->
  <div class="panel">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <span style="font-size:12px;font-weight:700;color:var(--text)">实验分组</span>
      <button class="btn btn-add" onclick="addGroup()">＋ 添加分组</button>
    </div>
    <div id="groupEditor"></div>
  </div>

  <!-- ====== TIMEPOINT CHIPS ====== -->
  <div class="panel chip-bar" id="chipBar">
    <span class="chip-bar-label">图表显示 ▸</span>
    <span id="chipContainer" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"></span>
    <span style="margin-left:auto">
      <button class="chip-preset" onclick="toggleAllChips()">全选/反选</button>
    </span>
  </div>

  <!-- ====== GROUP CARDS ====== -->
  <div class="group-grid" id="groupGrid"></div>

  <!-- ====== CHART ====== -->
  <div class="panel">
    <div class="chart-header">
      <h2>BMS Score Trajectory</h2>
      <div class="legend-inline" id="chartLegend"></div>
    </div>
    <div class="chart-wrap"><canvas id="bmsChart"></canvas></div>
  </div>

  <div class="footer">BMS · 0 = complete paralysis &nbsp;|&nbsp; 9 = normal locomotion &nbsp;|&nbsp; 拖动噪声滑块可调节误差棒大小</div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============ STATE ============
let groups = [
  { name:'Sham',          color:'#5b8c5a', type:'sham', plateau:9.0 },
  { name:'SCI + Vehicle', color:'#c44e52', type:'sci',  plateau:3.5 },
  { name:'SCI + Treat A', color:'#4c72b0', type:'sci',  plateau:5.2 },
  { name:'SCI + Treat B', color:'#8e6eb8', type:'sci',  plateau:6.8 },
];
let micePerGroup = 6;
let timepoints = [1,3,7,14,21,28];
let hiddenTP = new Set();
let data = [];   // data[g][m][tpIdx] = score (0-9)
let chart = null;

function clamp(v,lo,hi) { return Math.max(lo,Math.min(hi,v)); }
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}
function mean(arr) { return arr.reduce((a,b)=>a+b,0)/arr.length; }
function sem(arr) {
  if (arr.length <= 1) return 0;
  const m = mean(arr);
  return Math.sqrt(arr.reduce((s,x)=>s+(x-m)**2,0)/(arr.length-1)) / Math.sqrt(arr.length);
}

// ============ GROUP EDITOR ============
function renderGroupEditor() {
  const container = document.getElementById('groupEditor');
  container.innerHTML = groups.map((g, i) => `
    <div class="group-editor-row">
      <span style="font-family:'DM Mono',monospace;font-size:13px;color:var(--text-muted);min-width:20px">${i+1}</span>
      <input type="color" value="${g.color}" onchange="groups[${i}].color=this.value;rebuild()" title="颜色">
      <div class="fg">
        <label style="font-size:9px">组名</label>
        <input type="text" value="${g.name}" onchange="groups[${i}].name=this.value;rebuild()">
      </div>
      <div class="fg">
        <label style="font-size:9px">类型</label>
        <select onchange="groups[${i}].type=this.value;rebuild()">
          <option value="sham" ${g.type==='sham'?'selected':''}>Sham (高基线)</option>
          <option value="sci" ${g.type==='sci'?'selected':''}>SCI (恢复曲线)</option>
        </select>
      </div>
      ${g.type==='sci' ? `
      <div class="fg">
        <label style="font-size:9px">恢复上限 (0-9)</label>
        <input type="number" value="${g.plateau}" min="1" max="9" step="0.5"
          onchange="groups[${i}].plateau=clamp(parseFloat(this.value)||3,1,9);this.value=groups[${i}].plateau;rebuild()">
      </div>` : `<div class="fg"><label style="font-size:9px">基础分</label><input type="number" value="${g.plateau}" min="7" max="9" step="0.5" onchange="groups[${i}].plateau=clamp(parseFloat(this.value)||8,7,9);this.value=groups[${i}].plateau;rebuild()"></div>`}
      <button class="btn btn-danger" onclick="removeGroup(${i})" ${groups.length<=2?'disabled':''}>✕ 删除</button>
    </div>
  `).join('');
}

function addGroup() {
  const defaultColors = ['#e8a838','#56b4a9','#d55e00','#cc79a7','#009e73','#f0e442','#0072b2','#e69f00'];
  const used = new Set(groups.map(g=>g.color));
  const c = defaultColors.find(x=>!used.has(x)) || '#666666';
  groups.push({ name:`Group ${groups.length+1}`, color:c, type:'sci', plateau:4.0 });
  rebuild();
}

function removeGroup(i) {
  if (groups.length <= 2) { toast('至少保留 2 组'); return; }
  groups.splice(i, 1);
  rebuild();
}

// ============ TIMEPOINTS ============
function parseTimepoints(raw) {
  const parts = raw.split(/[,，\s]+/).filter(Boolean);
  const tps = [];
  for (const p of parts) {
    const n = parseInt(p, 10);
    if (!isNaN(n) && n>=0 && n<=365 && !tps.includes(n)) tps.push(n);
  }
  if (tps.length===0) return [1,3,7,14,21,28];
  tps.sort((a,b)=>a-b);
  return tps;
}

function onTimepointsChange() {
  const raw = document.getElementById('timepointsInput').value.trim();
  timepoints = parseTimepoints(raw);
  hiddenTP.clear();
  document.getElementById('timepointsInput').value = timepoints.join(',');
  rebuild();
}

function setPreset(type) {
  let tp;
  switch(type) {
    case 'sci':     tp=[1,3,7,14,21,28]; break;
    case 'acute':   tp=[1,2,3,5,7]; break;
    case 'chronic': tp=[7,14,21,28,35,42]; break;
    case 'daily':   tp=Array.from({length:14},(_,i)=>i+1); break;
  }
  timepoints = tp; hiddenTP.clear();
  document.getElementById('timepointsInput').value = tp.join(',');
  rebuild();
}

function toggleTP(idx) {
  if (hiddenTP.has(idx)) hiddenTP.delete(idx); else hiddenTP.add(idx);
  renderChips(); updateChart();
}
function toggleAllChips() {
  const visible = timepoints.filter((_,i)=>!hiddenTP.has(i));
  if (visible.length===timepoints.length) {
    for (let i=0;i<timepoints.length;i++) hiddenTP.add(i);
    hiddenTP.delete(0);
    if (timepoints.length>1) hiddenTP.delete(timepoints.length-1);
  } else { hiddenTP.clear(); }
  renderChips(); updateChart();
}
function renderChips() {
  document.getElementById('chipContainer').innerHTML = timepoints.map((d,i)=>{
    const on = !hiddenTP.has(i);
    return `<span class="tp-chip ${on?'on':'off'}" onclick="toggleTP(${i})" title="点击${on?'隐藏':'显示'} D${d}">
      <span style="font-size:10px">${on?'👁':'—'}</span> D${d}
    </span>`;
  }).join('');
}

// ============ DATA ============
function initData() {
  data = [];
  for (let g=0; g<groups.length; g++) {
    data[g] = [];
    for (let m=0; m<micePerGroup; m++) {
      data[g][m] = new Array(timepoints.length).fill(null);
    }
  }
}

function generateRandom() {
  initData();
  const noise = parseFloat(document.getElementById('noiseLevel').value) || 1.0;

  for (let g=0; g<groups.length; g++) {
    const grp = groups[g];
    for (let m=0; m<micePerGroup; m++) {
      for (let ti=0; ti<timepoints.length; ti++) {
        const day = timepoints[ti];
        if (grp.type === 'sham') {
          const base = (day<=2) ? grp.plateau-0.8+(Math.random()*0.6) : grp.plateau-0.3+(Math.random()*0.6);
          const n = (Math.random()-0.5)*noise*0.6;
          data[g][m][ti] = clamp(Math.round(base+n), 0, 9);
        } else {
          const steepness = 0.25 + (grp.plateau/9)*0.15;
          const midpoint = 4 + (1 - grp.plateau/9)*8;
          const raw = grp.plateau / (1+Math.exp(-steepness*(day-midpoint)));
          const n = (Math.random()-0.5)*noise*1.4;
          const fluc = Math.sin(day*0.3)*noise*0.25;
          data[g][m][ti] = clamp(Math.round(raw+n+fluc), 0, 9);
        }
      }
      if (grp.type==='sci') {
        data[g][m][0] = clamp(Math.round(Math.random()*1.5),0,2);
        if (timepoints.length>1 && timepoints[1]<=5) {
          data[g][m][1] = clamp(Math.round(0.5+Math.random()*2),0,3);
        }
      }
    }
  }
  renderAll(); updateChart();
  toast(`已生成随机数据 (噪声: ${noise.toFixed(1)})`);
}

// ============ RENDER TABLE ============
function renderAll() {
  const grid = document.getElementById('groupGrid');
  grid.style.gridTemplateColumns = groups.length<=2
    ? 'repeat(auto-fit, minmax(400px, 1fr))'
    : 'repeat(auto-fit, minmax(300px, 1fr))';
  grid.innerHTML = '';

  for (let g=0; g<groups.length; g++) {
    const card = document.createElement('div');
    card.className = 'group-card';
    const avgAll = data[g].flat().filter(x=>x!==null);
    const avgVal = avgAll.length ? mean(avgAll).toFixed(1) : '-';

    card.innerHTML = `
      <div class="group-card-header">
        <span class="group-name">
          <span class="group-dot" style="background:${groups[g].color}"></span>
          ${groups[g].name}
          <span style="font-size:10px;color:var(--text-muted);font-weight:400">${groups[g].type==='sham'?'Sham':'SCI'}</span>
        </span>
        <span class="group-n">n=${micePerGroup}</span>
      </div>
      <div class="group-card-body">
        <table class="mini-table">
          <thead><tr><th>#</th>${timepoints.map(d=>`<th>D${d}</th>`).join('')}</tr></thead>
          <tbody>
            ${Array.from({length:micePerGroup},(_,m)=>`
              <tr>
                <td class="mouse-label">M${m+1}</td>
                ${timepoints.map((_,ti)=>`
                  <td><input type="number" min="0" max="9" step="1"
                    value="${data[g][m][ti]!==null?data[g][m][ti]:''}"
                    data-g="${g}" data-m="${m}" data-ti="${ti}"
                    onchange="onCellChange(this)" onfocus="this.select()">
                  </td>`).join('')}
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <div class="group-avg"><span>全组均值</span><strong>${avgVal}</strong></div>
    `;
    grid.appendChild(card);
  }
}

function onCellChange(input) {
  const g=parseInt(input.dataset.g), m=parseInt(input.dataset.m), ti=parseInt(input.dataset.ti);
  const val=input.value.trim();
  if (val===''||val==='-') data[g][m][ti]=null;
  else { const num=parseInt(val,10); if (!isNaN(num)) data[g][m][ti]=clamp(num,0,9); }
  const card=input.closest('.group-card');
  const avgAll=data[g].flat().filter(x=>x!==null);
  card.querySelector('.group-avg strong').textContent = avgAll.length?mean(avgAll).toFixed(1):'-';
  updateChart();
}

// ============ CHART ============
function updateChart() {
  const ctx = document.getElementById('bmsChart').getContext('2d');
  const visibleIndices = timepoints.map((_,i)=>i).filter(i=>!hiddenTP.has(i));
  const labels = visibleIndices.map(i=>`D${timepoints[i]}`);

  const datasets = groups.map((grp, g) => {
    const means=[], sems=[];
    for (const ti of visibleIndices) {
      const vals = data[g].map(m=>m[ti]).filter(x=>x!==null);
      means.push(vals.length?mean(vals):null);
      sems.push(vals.length?sem(vals):null);
    }
    return {
      label:grp.name, data:means, errorBars:sems,
      borderColor:grp.color, backgroundColor:grp.color+'20',
      borderWidth:2.5, pointRadius:labels.length>20?1.5:4,
      pointHoverRadius:6, pointBackgroundColor:grp.color,
      tension:0, fill:false, spanGaps:false,
    };
  });

  if (chart) chart.destroy();
  chart = new Chart(ctx, {
    type:'line',
    data:{labels, datasets},
    options:{
      responsive:true, maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{display:false},
        tooltip:{
          backgroundColor:'#fff', titleColor:'#2c2c2c', bodyColor:'#2c2c2c',
          borderColor:'#e6e3dd', borderWidth:1, cornerRadius:8,
          titleFont:{family:'Space Grotesk',weight:'700',size:13},
          bodyFont:{family:'DM Mono',size:12},
          callbacks:{
            label:function(ctx){
              const d=ctx.dataIndex;
              const sv=ctx.dataset.errorBars?.[d];
              return sv!=null ? `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)} ± ${sv.toFixed(2)}` : `${ctx.dataset.label}: ${ctx.parsed.y.toFixed(1)}`;
            }
          }
        }
      },
      scales:{
        x:{
          title:{display:true,text:'Days Post-Injury',font:{family:'Space Grotesk',size:12,weight:'600'}},
          grid:{color:'#f0ede8'}, ticks:{font:{family:'DM Mono',size:10},maxRotation:45}
        },
        y:{
          title:{display:true,text:'BMS Score',font:{family:'Space Grotesk',size:12,weight:'600'}},
          min:0,max:9, ticks:{stepSize:1,font:{family:'DM Mono',size:10}}, grid:{color:'#f0ede8'}
        }
      }
    },
    plugins:[{
      id:'semErrorBars',
      afterDraw(chart){
        const {ctx, scales:{x:xScale,y:yScale}} = chart;
        chart.data.datasets.forEach((ds,i)=>{
          if (!ds.errorBars) return;
          const meta = chart.getDatasetMeta(i);
          ds.data.forEach((val,j)=>{
            if (val===null||ds.errorBars[j]==null) return;
            const pt=meta.data[j]; if (!pt) return;
            const yTop=yScale.getPixelForValue(val+ds.errorBars[j]);
            const yBot=yScale.getPixelForValue(val-ds.errorBars[j]);
            ctx.save(); ctx.strokeStyle=ds.borderColor; ctx.lineWidth=1.5;
            ctx.beginPath(); ctx.moveTo(pt.x,yTop); ctx.lineTo(pt.x,yBot); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(pt.x-3,yTop); ctx.lineTo(pt.x+3,yTop);
            ctx.moveTo(pt.x-3,yBot); ctx.lineTo(pt.x+3,yBot); ctx.stroke();
            ctx.restore();
          });
        });
      }
    }]
  });

  document.getElementById('chartLegend').innerHTML = groups.map(g=>
    `<span class="legend-item"><span class="legend-line" style="background:${g.color}"></span>${g.name}</span>`
  ).join('');
}

// ============ CSV ============
function exportCSV() {
  let csv = '﻿';
  for (let g=0; g<groups.length; g++) {
    csv += `${groups[g].name} (${groups[g].type==='sham'?'Sham':'SCI'})\n`;
    csv += 'Mouse,'+timepoints.map(d=>`Day${d}`).join(',')+'\n';
    for (let m=0; m<micePerGroup; m++) {
      csv += `M${m+1},`+timepoints.map((_,ti)=>data[g][m][ti]!==null?data[g][m][ti]:'').join(',')+'\n';
    }
    const avgs=[], sems=[];
    for (let ti=0; ti<timepoints.length; ti++) {
      const vals=data[g].map(m=>m[ti]).filter(x=>x!==null);
      avgs.push(vals.length?mean(vals).toFixed(2):'');
      sems.push(vals.length?sem(vals).toFixed(3):'');
    }
    csv += 'Mean,'+avgs.join(',')+'\n';
    csv += 'SEM,'+sems.join(',')+'\n\n';
  }
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url;
  a.download=`BMS_Scores_${new Date().toISOString().slice(0,10)}.csv`;
  a.click(); URL.revokeObjectURL(url);
  toast('CSV 已导出');
}

// ============ REBUILD ============
function rebuild() {
  micePerGroup = clamp(parseInt(document.getElementById('micePerGroup').value)||6,2,20);
  const raw = document.getElementById('timepointsInput').value.trim();
  timepoints = parseTimepoints(raw);
  document.getElementById('timepointsInput').value = timepoints.join(',');
  for (const idx of hiddenTP) { if (idx>=timepoints.length) hiddenTP.delete(idx); }
  initData(); renderGroupEditor(); renderAll(); renderChips(); updateChart();
}

// ============ INIT ============
renderGroupEditor();
initData(); renderAll(); renderChips();
generateRandom(); // auto-generate on load
</script>
